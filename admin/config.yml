# Decap CMS — Jing · Meet China
# 后台地址：https://dynamic-bombolone-713dfe.netlify.app/admin/
# 内容改动会提交到 GitHub 仓库 src/ 目录，GitHub Actions 自动重新构建并部署。

backend:
  name: git-gateway
  repo: ggdy0540-hub/china-custom-tours
  branch: main
  site_domain: dynamic-bombolone-713dfe.netlify.app

media_folder: "src/assets/img"
public_folder: "/assets/img"

locale: en
publish_mode: simple

collections:
  - name: "settings"
    label: "全站设置 Site Settings"
    files:
      - name: "site"
        label: "联系信息 / 页脚"
        file: "src/_data/site.json"
        fields:
          - { label: "品牌名称", name: brandName, widget: string }
          - { label: "品牌副标题", name: brandSub, widget: string }
          - { label: "电话（显示）", name: tel, widget: string }
          - { label: "电话（链接，去掉空格）", name: telHref, widget: string }
          - { label: "邮箱", name: email, widget: string }
          - { label: "地址", name: address, widget: string }
          - { label: "页脚简介", name: footerText, widget: text }
          - { label: "执照号", name: license, widget: string }
          - { label: "页脚中文标语", name: footerZh, widget: string }
  - name: "pages"
    label: "网站页面 Pages"
    files:
      - name: "index"
        label: "首页 Home"
        file: "src/index.njk"
        fields:
          - { label: "页面标题（浏览器标签）", name: title, widget: string }
          - { label: "页面描述（SEO）", name: description, widget: text }
          - label: "页面区块"
            name: sections
            widget: list
            fields:
              - { label: "区块名称", name: label, widget: string }
              - label: "区块内容"
                name: html
                widget: code
                default_language: html
                allow_language_selection: false
                output_code_only: true
      - name: "about"
        label: "关于我们 About"
        file: "src/about.njk"
        fields:
          - { label: "页面标题（浏览器标签）", name: title, widget: string }
          - { label: "页面描述（SEO）", name: description, widget: text }
          - label: "页面区块"
            name: sections
            widget: list
            fields:
              - { label: "区块名称", name: label, widget: string }
              - label: "区块内容"
                name: html
                widget: code
                default_language: html
                allow_language_selection: false
