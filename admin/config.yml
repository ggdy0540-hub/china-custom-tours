# Decap CMS configuration — Jing · Meet China
# Auth uses Netlify's free OAuth proxy.
# GitHub OAuth App callback must be: https://api.netlify.com/auth/done

backend:
  name: github
  repo: ggdy0540-hub/china-custom-tours
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

# Where uploaded images are stored / referenced
media_folder: "assets/img"
public_folder: "/assets/img"

# Editor locale
locale: en

publish_mode: simple

collections:
  - name: "pages"
    label: "网站页面"
    files:
      - name: "home"
        label: "首页 Home"
        file: "index.html"
        fields:
          - { name: html, label: "页面内容 (HTML)", widget: code, default_language: html, required: false }
      - name: "about"
        label: "关于我们 About"
        file: "about.html"
        fields:
          - { name: html, label: "页面内容 (HTML)", widget: code, default_language: html, required: false }
